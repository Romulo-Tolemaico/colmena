<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Colmena - Sistema comunitario de monitoreo ambiental" />
    <meta name="theme-color" content="#5D7341" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <title>Colmena</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #F5F1E8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .loading-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        gap: 16px;
      }
      .loading-container p {
        color: #5D7341;
        font-size: 1.1rem;
        font-weight: 500;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e0ddd4;
        border-top-color: #5D7341;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading-container">
      <div class="spinner"></div>
      <p>Cargando Colmena...</p>
    </div>
    <noscript>
      <p style="text-align:center; padding:2rem;">
        Este sistema requiere JavaScript habilitado para funcionar.
      </p>
    </noscript>
    <script src="main.dart.js" type="application/javascript"></script>
    <script>
      window.addEventListener('flutter-first-frame', function () {
        var loader = document.getElementById('loading');
        if (loader) loader.remove();
      });
    </script>
  </body>
</html>
